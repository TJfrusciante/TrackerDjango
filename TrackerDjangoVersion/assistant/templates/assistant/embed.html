<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #0f172a; color: #e2e8f0; font-size: 14px;
        }
        .chat-wrapper { display: flex; flex-direction: column; height: 100%; padding: 8px; gap: 8px; }
        .chat-box { flex: 1 1 auto; overflow-y: auto; background: rgba(15, 23, 42, 0.6); border: 1px solid #1f2937; border-radius: 12px; padding: 8px; }
        .chat-bubble { padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; }
        .chat-bubble.user { background: linear-gradient(135deg, #2563eb, #22c55e); color: #fff; }
        .chat-bubble.assistant { background: rgba(148, 163, 184, 0.2); color: #e2e8f0; border: 1px solid #334155; }
        .chat-meta { font-size: 12px; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="chat-wrapper">
        <div class="chat-box" id="chatBox">
        {% for msg in history %}
            <div class="chat-bubble {% if msg.role == 'user' %}user text-end{% else %}assistant{% endif %}">
                <div class="chat-meta mb-1 text-secondary">{{ msg.created_at|date:"d/m H:i" }} · {{ msg.role|capfirst }}</div>
                <div class="chat-text">{{ msg.content|linebreaksbr }}</div>
            </div>
        {% empty %}
            <p class="text-secondary small mb-0">Sem mensagens.</p>
        {% endfor %}
    </div>
        <form method="post" id="chatForm">
            {% csrf_token %}
            <div class="mb-2">
                <textarea name="message" class="form-control form-control-sm" rows="2" placeholder="Pergunte algo..." autocomplete="off"></textarea>
            </div>
            <div class="d-grid">
                <button class="btn btn-primary btn-sm" type="submit">Enviar</button>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const chatBox = document.getElementById('chatBox');
        if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
        const chatForm = document.getElementById('chatForm');
        if (chatForm) {
            const textarea = chatForm.querySelector('textarea[name="message"]');
            textarea.addEventListener('keydown', (ev) => {
                if (ev.key === 'Enter' && !ev.shiftKey) {
                    ev.preventDefault();
                    chatForm.submit();
                }
            });
        }
    </script>
</body>
</html>
